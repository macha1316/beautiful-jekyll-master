<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>Dodge! – Minimal Canvas Game</title>
  <style>
    html, body { height: 100%; margin: 0; background: #0f1226; color: #e6e9ff; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
    #wrap { display: grid; place-items: center; height: 100%; }
    canvas { background: radial-gradient(1200px 800px at 50% 30%, #1b2250, #0f1226); border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,.35); touch-action: none; }
    #hud { position: fixed; top: 12px; left: 12px; right: 12px; display: flex; justify-content: space-between; pointer-events: none; font-weight: 700; letter-spacing: .4px; }
    .pill { backdrop-filter: blur(8px); background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.12); border-radius: 999px; padding: 8px 12px; }
    #btns { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); display: none; gap: 16px; }
    .btn { width: 96px; height: 96px; border-radius: 50%; border: 1px solid rgba(255,255,255,.15); background: rgba(255,255,255,.08); color: #fff; font-size: 28px; display: grid; place-items: center; user-select: none; }
    .btn:active { transform: scale(.98); }
    #overlay { position: fixed; inset: 0; display: grid; place-items: center; backdrop-filter: blur(6px); background: rgba(10,12,26,.55); }
    #card { background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.15); border-radius: 16px; padding: 24px; width: min(92vw, 420px); text-align: center; }
    #card h1 { margin: 0 0 8px; font-size: 24px; }
    #card p { margin: 6px 0 16px; color: #c8ccff; }
    #card button { width: 100%; padding: 12px 16px; border-radius: 12px; border: 1px solid rgba(255,255,255,.2); background: #5865f2; color: #fff; font-weight: 700; font-size: 16px; }
    @media (pointer: coarse) { #btns { display: flex; } }
  </style>
</head>
<body>
  <div id="wrap"><canvas id="game" width="420" height="700"></canvas></div>
  <div id="hud">
    <div class="pill">Score: <span id="score">0</span></div>
    <div class="pill">Best: <span id="best">0</span></div>
  </div>
  <div id="btns" aria-hidden="true">
    <div class="btn" id="left">⟵</div>
    <div class="btn" id="right">⟶</div>
  </div>
  <div id="overlay">
    <div id="card">
      <h1>Dodge!</h1>
      <p>矢印キー or 画面の ◀▶ を使って、落ちてくるブロックを避け続けろ。</p>
      <button id="start">Start</button>
    </div>
  </div>
  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const W = canvas.width, H = canvas.height;

    // ---- state ----
    const state = {
      playing: false,
      t: 0,
      score: 0,
      best: Number(localStorage.getItem('best-dodge')||0),
      player: { x: W/2, y: H-80, r: 18, vx: 0 },
      inputs: { left: false, right: false },
      obstacles: [],
      spawnEvery: 60, // frames
    };
    document.getElementById('best').textContent = state.best;

    // ---- input ----
    addEventListener('keydown', e => {
      if (e.key === 'ArrowLeft' || e.key === 'a') state.inputs.left = true;
      if (e.key === 'ArrowRight' || e.key === 'd') state.inputs.right = true;
      if (!state.playing && e.key === ' ') start();
    });
    addEventListener('keyup', e => {
      if (e.key === 'ArrowLeft' || e.key === 'a') state.inputs.left = false;
      if (e.key === 'ArrowRight' || e.key === 'd') state.inputs.right = false;
    });
    // touch buttons
    const leftBtn = document.getElementById('left');
    const rightBtn = document.getElementById('right');
    const setHold = (btn, key, on) => {
      const p = e => { e.preventDefault(); state.inputs[key] = on; };
      btn.addEventListener('pointerdown', p);
      btn.addEventListener('pointerup', e=>{state.inputs[key]=false;});
      btn.addEventListener('pointerleave', e=>{state.inputs[key]=false;});
      btn.addEventListener('contextmenu', e=>e.preventDefault());
    };
    setHold(leftBtn, 'left', true);
    setHold(rightBtn, 'right', true);

    // ---- helpers ----
    function rand(min, max){ return Math.random()*(max-min)+min; }
    function clamp(v, mi, ma){ return Math.max(mi, Math.min(ma, v)); }

    // ---- gameplay ----
    function reset(){
      state.t = 0; state.score = 0; state.player.x = W/2; state.player.vx = 0;
      state.obstacles = []; state.spawnEvery = 60; // slower at start
      document.getElementById('score').textContent = '0';
    }

    function start(){
      reset();
      state.playing = true;
      document.getElementById('overlay').style.display = 'none';
      loop();
    }

    function end(){
      state.playing = false;
      if (state.score > state.best){ state.best = state.score; localStorage.setItem('best-dodge', state.best); }
      document.getElementById('best').textContent = state.best;
      const card = document.getElementById('card');
      card.innerHTML = `<h1>Game Over</h1><p>Score: <b>${state.score}</b></p><button id="restart">Retry</button>`;
      document.getElementById('overlay').style.display = 'grid';
      document.getElementById('restart').onclick = start;
    }

    function spawn(){
      const w = rand(30, 80);
      const x = rand(10, W - w - 10);
      const speed = rand(2.0, 4.5) + state.t*0.0008; // scale up slowly
      state.obstacles.push({ x, y: -20, w, h: rand(14, 24), v: speed });
    }

    function update(){
      state.t++;
      // spawn rate accelerates
      if (state.t % Math.max(18, Math.floor(state.spawnEvery - state.t*0.01)) === 0) spawn();

      // player
      const acc = 0.9; const fric = 0.86; const maxV = 6.2;
      const dir = (state.inputs.left? -1:0) + (state.inputs.right? 1:0);
      state.player.vx += dir*acc;
      state.player.vx *= fric;
      state.player.vx = clamp(state.player.vx, -maxV, maxV);
      state.player.x = clamp(state.player.x + state.player.vx, 18, W-18);

      // obstacles
      for (const o of state.obstacles){ o.y += o.v; }
      state.obstacles = state.obstacles.filter(o => o.y < H+40);

      // scoring
      if (state.t % 30 === 0){ state.score++; document.getElementById('score').textContent = state.score; }

      // collisions (circle-rect)
      const p = state.player;
      for (const o of state.obstacles){
        const cx = clamp(p.x, o.x, o.x+o.w);
        const cy = clamp(p.y, o.y, o.y+o.h);
        const dx = p.x - cx, dy = p.y - cy;
        if (dx*dx + dy*dy < p.r*p.r){ end(); break; }
      }
    }

    // ---- render ----
    function draw(){
      ctx.clearRect(0,0,W,H);

      // subtle star background
      for (let i=0;i<24;i++){
        const y = (state.t*0.6 + i*40) % (H+40) - 40;
        ctx.globalAlpha = .12 + (i%3)*.05; ctx.fillStyle = '#c5cbff';
        ctx.fillRect((i*37)%W, y, 2, 8);
      }
      ctx.globalAlpha = 1;

      // player (glow)
      const p = state.player;
      const grd = ctx.createRadialGradient(p.x, p.y, 4, p.x, p.y, 40);
      grd.addColorStop(0, '#8ea0ff'); grd.addColorStop(1, 'rgba(142,160,255,0)');
      ctx.fillStyle = grd; ctx.beginPath(); ctx.arc(p.x, p.y, 26, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#aeb9ff'; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2); ctx.fill();

      // obstacles
      for (const o of state.obstacles){
        ctx.fillStyle = 'rgba(255,255,255,.08)';
        ctx.fillRect(o.x-6, o.y-6, o.w+12, o.h+12);
        ctx.fillStyle = '#f25f5c';
        ctx.fillRect(o.x, o.y, o.w, o.h);
      }
    }

    function loop(){
      if (!state.playing) return;
      update();
      draw();
      requestAnimationFrame(loop);
    }

    document.getElementById('start').onclick = start;

    // resize to fit device while keeping aspect
    function fit(){
      const s = Math.min(innerWidth/ (W+0), innerHeight/(H+0));
      canvas.style.width = Math.floor(W*s) + 'px';
      canvas.style.height = Math.floor(H*s) + 'px';
    }
    addEventListener('resize', fit); fit();
  </script>
</body>
</html>
