<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Quadrant Memo</title>
  <style>
    :root {
      --bg: #0f172a; /* slate-900 */
      --panel: #111827; /* gray-900 */
      --muted: #94a3b8; /* slate-400 */
      --text: #e5e7eb; /* gray-200 */
      --accent: #22d3ee; /* cyan-400 */
      --accent-2: #a78bfa; /* violet-400 */
      --danger: #f43f5e; /* rose-500 */
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
      background: radial-gradient(1200px 800px at 10% 0%, #0b1224 0%, var(--bg) 40%), var(--bg);
      color: var(--text);
    }
    header {
      display: flex; align-items: center; gap: .75rem; padding: .8rem 1rem; position: sticky; top: 0; z-index: 5;
      backdrop-filter: blur(8px); background: linear-gradient(180deg, #0f172acc, #0f172a80 60%, transparent);
      border-bottom: 1px solid #1f2937;
    }
    header h1 { font-size: 1rem; margin: 0; letter-spacing: .5px; font-weight: 700; }
    header .badge { color: var(--accent); font-weight: 700; }
    .grow { flex: 1; }
    .btn { background: #1f2937; color: var(--text); border: 1px solid #334155; padding: .45rem .7rem; border-radius: .6rem; cursor: pointer; font-weight: 600; }
    .btn:hover { border-color: var(--accent); box-shadow: 0 0 0 2px #22d3ee20 inset; }
    .btn.ghost { background: transparent; }
    .btn.danger { border-color: #7f1d1d; color: #fecaca; }
    .toolbar { display: flex; gap: .5rem; align-items: center; }

    .wrap { display: grid; grid-template-columns: 300px 1fr; height: calc(100% - 58px); }
    .sidebar { border-right: 1px solid #1f2937; padding: .75rem; background: #0b1220; overflow: auto; }
    .search { width: 100%; padding: .6rem .7rem; border-radius: .6rem; border: 1px solid #334155; background: #0b1226; color: var(--text); }
    .hint { font-size: .8rem; color: var(--muted); margin: .5rem 0 1rem; }
    .tags { display: flex; flex-wrap: wrap; gap: .4rem; }
    .tag { font-size: .8rem; background: #0b132a; border: 1px solid #1f2a44; padding: .25rem .5rem; border-radius: 999px; cursor: pointer; }
    .tag.active { border-color: var(--accent); color: var(--accent); }

    .board { position: relative; padding: 1rem; }
    .grid { position: absolute; inset: 1rem; border: 1px dashed #334155; border-radius: .8rem; }
    .grid::before, .grid::after { content: ""; position: absolute; background: #334155; }
    .grid::before { left: 50%; top: 0; width: 1px; height: 100%; }
    .grid::after { top: 50%; left: 0; height: 1px; width: 100%; }
    .axis { position: absolute; font-size: .8rem; color: var(--muted); }
    .axis.x { bottom: .2rem; left: 50%; transform: translateX(-50%); }
    .axis.y { top: 50%; left: .2rem; transform: translateY(-50%) rotate(-90deg); transform-origin: left top; }

    .dropzone { position: absolute; inset: 1rem; }

    .card {
      position: absolute; min-width: 180px; max-width: 320px; background: #0a1426; border: 1px solid #20324f; border-radius: .8rem; padding: .6rem .6rem .4rem;
      box-shadow: 0 8px 20px #0006; cursor: grab; user-select: none;
    }
    .card.dragging { opacity: .85; outline: 2px solid var(--accent); cursor: grabbing; }
    .card header { display: flex; align-items: center; gap: .5rem; padding: 0; background: transparent; border: 0; position: relative; }
    .card header .title { flex: 1; font-weight: 700; font-size: .9rem; color: #e2e8f0; }
    .card .content { margin-top: .4rem; padding: .5rem; border-radius: .5rem; background: #0a172e; border: 1px solid #1b2a45; color: #dbeafe; min-height: 54px; outline: none; white-space: pre-wrap; }
    .meta { display: flex; justify-content: space-between; align-items: center; margin-top: .35rem; font-size: .75rem; color: var(--muted); }
    .chips { display: flex; gap: .35rem; flex-wrap: wrap; }
    .chip { padding: .1rem .45rem; border: 1px solid #243b61; border-radius: 999px; }
    .locked { filter: blur(2px) saturate(.6); pointer-events: none; }

    .empty { position: absolute; inset: 0; display: grid; place-items: center; color: #94a3b8; opacity: .7; }

    footer { position: fixed; right: .75rem; bottom: .75rem; display: flex; gap: .5rem; }

    .toast { position: fixed; left: 50%; bottom: 1rem; transform: translateX(-50%); background: #0b1326; border: 1px solid #1f2a44; padding: .5rem .75rem; border-radius: .6rem; color: var(--text); opacity: 0; pointer-events: none; transition: opacity .2s; }
    .toast.show { opacity: 1; }

    .switch { display: inline-flex; border: 1px solid #334155; border-radius: .6rem; overflow: hidden; }
    .switch button { border: 0; padding: .45rem .6rem; background: transparent; color: var(--muted); cursor: pointer; }
    .switch button.active { color: var(--text); background: #162338; }

    /* List view */
    .list { display: none; padding: .75rem; }
    .list .row { background: #0a1426; border: 1px solid #20324f; border-radius: .6rem; padding: .6rem; margin-bottom: .5rem; display: grid; grid-template-columns: 1fr auto; gap: .5rem; }
    .list .row .row-title { font-weight: 700; }
    .list .row .row-tags { color: var(--muted); font-size: .8rem; }

    @media (max-width: 900px) {
      .wrap { grid-template-columns: 1fr; }
      .sidebar { height: 260px; border-right: none; border-bottom: 1px solid #1f2937; }
      .board { height: calc(100vh - 260px - 58px); }
    }
  </style>
</head>
<body>
  <header>
    <h1>Quadrant Memo <span class="badge">β</span></h1>
    <div class="switch" id="viewSwitch">
      <button data-view="board" class="active">ボード</button>
      <button data-view="list">リスト</button>
    </div>
    <div class="grow"></div>
    <div class="toolbar">
      <button class="btn" id="newBtn">新規メモ (N)</button>
      <button class="btn" id="exportBtn" title="JSONを書き出し (E)">エクスポート</button>
      <label class="btn ghost" for="importFile">インポート<input id="importFile" type="file" accept="application/json" hidden></label>
      <button class="btn danger" id="clearBtn">全消去</button>
    </div>
  </header>

  <div class="wrap">
    <aside class="sidebar">
      <input id="q" class="search" placeholder="検索 / #タグで絞り込み (/ でフォーカス)" />
      <div class="hint">ユニーク機能: 「緊急度 × 取り組む体力」の2軸ボードにカードをドラッグして並べる。未来日時までロックする <b>タイムカプセル</b> 付き。</div>
      <div id="tagPanel" class="tags"></div>
      <div style="margin-top:1rem; display:grid; gap:.5rem;">
        <label>タイムカプセル解除日時 <input id="unlockAt" type="datetime-local" style="width:100%; background:#0b1226; color:var(--text); border:1px solid #334155; border-radius:.5rem; padding:.4rem"/></label>
        <small class="hint">設定すると、この日時までメモの編集/閲覧がロックされます。</small>
      </div>
    </aside>

    <main class="board" id="board">
      <div class="grid"></div>
      <div class="axis x">緊急 ← 低 / 高 →</div>
      <div class="axis y">体力 ← 少 / 多 →</div>
      <div class="dropzone" id="dropzone"></div>
      <div class="empty" id="empty">まだメモがありません。「新規メモ」か N キーで作成。</div>
    </main>

    <section class="list" id="listView"></section>
  </div>

  <footer>
    <button class="btn" id="helpBtn">使い方</button>
  </footer>

  <div class="toast" id="toast"></div>

  <script>
    const $ = (sel, el=document) => el.querySelector(sel);
    const $$ = (sel, el=document) => [...el.querySelectorAll(sel)];
    const storeKey = 'quadrant-memo-v1';

    const state = {
      notes: load() || [],
      filter: { text: '', tag: null },
      view: 'board',
    };

    function uid() { return Math.random().toString(36).slice(2,9); }
    function save() { localStorage.setItem(storeKey, JSON.stringify(state.notes)); }
    function load() { try { return JSON.parse(localStorage.getItem(storeKey) || '[]'); } catch { return []; } }
    function nowISO(dt=new Date()) { dt.setSeconds(0,0); return dt.toISOString().slice(0,16); }

    function extractTags(text) { return (text.match(/#[\p{L}\d_\-]+/gu) || []).map(t=>t.toLowerCase()); }

    function addNote(partial={}) {
      const id = uid();
      const note = {
        id,
        title: partial.title || '無題',
        body: partial.body || '',
        x: partial.x ?? 0.2 + Math.random()*0.6,
        y: partial.y ?? 0.2 + Math.random()*0.6,
        tags: partial.tags || [],
        createdAt: partial.createdAt || new Date().toISOString(),
        updatedAt: new Date().toISOString(),
        unlockAt: partial.unlockAt || $('#unlockAt').value || null,
      };
      state.notes.push(note);
      save();
      render();
      toast('メモを作成');
      return note;
    }

    function removeNote(id) {
      state.notes = state.notes.filter(n=>n.id!==id);
      save(); render(); toast('削除しました');
    }

    function updateNote(id, patch) {
      const note = state.notes.find(n=>n.id===id);
      if (!note) return;
      Object.assign(note, patch, { updatedAt: new Date().toISOString() });
      note.tags = dedupe([...(note.tags||[]), ...extractTags(note.title + '\n' + note.body)]);
      save();
    }

    function dedupe(arr){ return [...new Set(arr)]; }

    function formatDate(s){ if(!s) return ''; const d=new Date(s); return d.toLocaleString(); }

    function isLocked(note){ if(!note.unlockAt) return false; return new Date() < new Date(note.unlockAt); }

    function render() {
      $('#viewSwitch button[data-view="board"]').classList.toggle('active', state.view==='board');
      $('#viewSwitch button[data-view="list"]').classList.toggle('active', state.view==='list');
      $('#board').style.display = state.view==='board' ? 'block' : 'none';
      $('#listView').style.display = state.view==='list' ? 'block' : 'none';

      const q = state.filter.text.toLowerCase();
      const tag = state.filter.tag;
      const filtered = state.notes.filter(n=>{
        const hay = (n.title + ' ' + n.body + ' ' + (n.tags||[]).join(' ')).toLowerCase();
        const okQ = q ? hay.includes(q) : true;
        const okT = tag ? (n.tags||[]).includes(tag) : true;
        return okQ && okT;
      });

      $('#empty').style.display = filtered.length? 'none':'grid';

      // Board view
      const dz = $('#dropzone'); dz.innerHTML = '';
      filtered.forEach(n=>{
        const card = document.createElement('div');
        card.className = 'card';
        card.style.left = (n.x*100) + '%';
        card.style.top = (n.y*100) + '%';
        card.style.transform = 'translate(-50%, -50%)';
        if (isLocked(n)) card.classList.add('locked');

        card.innerHTML = `
          <header>
            <input class="title title-input" value="${escapeHtml(n.title)}" ${isLocked(n)?'disabled':''} />
            <button class="btn ghost del" title="削除">✕</button>
          </header>
          <div class="content" contenteditable="${!isLocked(n)}">${escapeHtml(n.body)}</div>
          <div class="meta">
            <div class="chips">${(n.tags||[]).map(t=>`<span class="chip">${escapeHtml(t)}</span>`).join('')}</div>
            <span>${isLocked(n)?'🔒 '+new Date(n.unlockAt).toLocaleString():'更新 '+timeAgo(n.updatedAt)}</span>
          </div>`;

        // Dragging
        let dragging = false; let start = null;
        card.addEventListener('pointerdown', (e)=>{
          if (e.target.classList.contains('title-input') || e.target.isContentEditable || e.target.closest('button')) return; // don't drag when editing
          dragging = true; card.setPointerCapture(e.pointerId); card.classList.add('dragging'); start = {x:e.clientX, y:e.clientY};
        });
        card.addEventListener('pointermove', (e)=>{
          if(!dragging) return; const rect = dz.getBoundingClientRect();
          const nx = clamp((e.clientX - rect.left)/rect.width, 0.02, 0.98);
          const ny = clamp((e.clientY - rect.top)/rect.height, 0.02, 0.98);
          card.style.left = (nx*100)+'%'; card.style.top = (ny*100)+'%';
        });
        card.addEventListener('pointerup', (e)=>{
          if(!dragging) return; dragging=false; card.releasePointerCapture(e.pointerId); card.classList.remove('dragging');
          const rect = dz.getBoundingClientRect();
          const nx = clamp((e.clientX - rect.left)/rect.width, 0.02, 0.98);
          const ny = clamp((e.clientY - rect.top)/rect.height, 0.02, 0.98);
          updateNote(n.id, { x:nx, y:ny }); save(); toast('位置を保存');
        });

        // Edit title/body
        card.querySelector('.title-input').addEventListener('input', (e)=>{ updateNote(n.id, { title: e.target.value }); renderTags(); });
        card.querySelector('.content').addEventListener('input', (e)=>{ updateNote(n.id, { body: e.target.innerText }); renderTags(); });

        // Delete
        card.querySelector('.del').addEventListener('click', ()=>{ if(confirm('このメモを削除しますか？')) removeNote(n.id); });

        dz.appendChild(card);
      });

      // List view
      const lv = $('#listView'); lv.innerHTML = '';
      filtered.sort((a,b)=> new Date(b.updatedAt) - new Date(a.updatedAt)).forEach(n=>{
        const row = document.createElement('div'); row.className='row';
        row.innerHTML = `
          <div>
            <div class="row-title">${escapeHtml(n.title)}</div>
            <div class="row-tags">${(n.tags||[]).join(' ')} ${n.unlockAt? ' · 🔒'+new Date(n.unlockAt).toLocaleString():''}</div>
          </div>
          <div style="display:flex;gap:.4rem;align-items:center;">
            <button class="btn ghost jmp">ボードで表示</button>
            <button class="btn ghost rm">削除</button>
          </div>`;
        row.querySelector('.rm').addEventListener('click', ()=>{ if(confirm('このメモを削除しますか？')) removeNote(n.id); });
        row.querySelector('.jmp').addEventListener('click', ()=>{ state.view='board'; render(); });
        lv.appendChild(row);
      });

      renderTags();
    }

    function renderTags(){
      const panel = $('#tagPanel'); panel.innerHTML='';
      const all = dedupe(state.notes.flatMap(n=>n.tags||[])).sort();
      all.forEach(t=>{
        const el=document.createElement('button'); el.className='tag'; el.textContent=t; if(state.filter.tag===t) el.classList.add('active');
        el.addEventListener('click', ()=>{ state.filter.tag = state.filter.tag===t ? null : t; render(); });
        panel.appendChild(el);
      });
    }

    function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'), 1200); }

    function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m])); }
    function clamp(n, a, b){ return Math.min(b, Math.max(a, n)); }
    function timeAgo(iso){ const sec=Math.floor((Date.now()-new Date(iso))/1000); if(sec<60) return sec+'秒前'; const m=Math.floor(sec/60); if(m<60) return m+'分前'; const h=Math.floor(m/60); if(h<24) return h+'時間前'; const d=Math.floor(h/24); return d+'日前'; }

    // Event wiring
    $('#newBtn').addEventListener('click', ()=> addNote({ title: '新しいメモ', body: 'ここに書く。#tag' }));
    $('#exportBtn').addEventListener('click', ()=>{
      const blob = new Blob([JSON.stringify(state.notes, null, 2)], {type:'application/json'});
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'quadrant-memo-backup.json'; a.click(); URL.revokeObjectURL(a.href); toast('JSONを書き出しました');
    });
    $('#importFile').addEventListener('change', (e)=>{
      const file = e.target.files[0]; if(!file) return; const r = new FileReader();
      r.onload = () => { try { const arr = JSON.parse(r.result); if(!Array.isArray(arr)) throw new Error('invalid'); state.notes = arr; save(); render(); toast('インポート完了'); } catch { alert('JSONが不正です'); } };
      r.readAsText(file);
    });
    $('#clearBtn').addEventListener('click', ()=>{
      if(confirm('ローカルの全メモを削除します。元に戻せません。')) { state.notes = []; save(); render(); }
    });

    $('#q').addEventListener('input', (e)=>{ state.filter.text = e.target.value.trim().toLowerCase(); render(); });
    $('#q').addEventListener('keydown', (e)=>{ if(e.key==='Escape'){ e.target.value=''; state.filter.text=''; render(); }});

    $('#helpBtn').addEventListener('click', ()=>{
      alert(`★ 使い方\n\n・新規メモ: 右上ボタン or N キー\n・ドラッグ: ボード上でカードを掴んで移動\n・検索: 左の検索欄 (/ でフォーカス)\n・タグ: #todo のように本文/タイトルに書く→自動抽出\n・タイムカプセル: 左で日時を選び、作成するとその時刻まで🔒\n・切替: ボード / リスト\n・保存: 自動保存 (LocalStorage)\n・バックアップ: エクスポート/インポート (JSON)\n\nX軸=緊急度, Y軸=取り組む体力。右上ほど「今やるべき」。`);
    });

    $('#viewSwitch').addEventListener('click', (e)=>{
      const btn = e.target.closest('button'); if(!btn) return; state.view = btn.dataset.view; render();
    });

    // Keyboard shortcuts
    window.addEventListener('keydown', (e)=>{
      if(e.key==='n' || (e.key==='N')) { addNote({ title:'新しいメモ', body:'' }); }
      if(e.key==='/'){ e.preventDefault(); $('#q').focus(); }
      if(e.key==='e' || e.key==='E'){ $('#exportBtn').click(); }
    });

    // Initialize default unlockAt control
    const d = new Date(); d.setHours(d.getHours()+1); $('#unlockAt').value = nowISO(d);

    // First render
    render();
  </script>
</body>
</html>
